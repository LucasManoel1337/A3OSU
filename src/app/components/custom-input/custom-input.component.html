<div class="custom-input-group">
  <label *ngIf="label" [for]="name">{{ label }}</label>
  
  <div class="input-wrapper">
    <input
      [type]="inputType"
      [id]="name"
      [name]="name"
      [placeholder]="placeholder"
      [class.has-password-toggle]="showPasswordToggle && type === 'password'"
      [disabled]="disabled"
      [ngModel]="value"
      (ngModelChange)="onValueChange($event)"
      [ngModelOptions]="{standalone: true}"
    />
    <button
      *ngIf="showPasswordToggle && type === 'password'"
      type="button"
      class="password-visibility-toggle"
      [attr.aria-label]="passwordVisible ? 'Ocultar senha' : 'Mostrar senha'"
      [attr.aria-pressed]="passwordVisible"
      [disabled]="disabled"
      (click)="togglePasswordVisibility()">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path>
        <circle cx="12" cy="12" r="3"></circle>
        <path *ngIf="passwordVisible" d="m4 4 16 16"></path>
      </svg>
    </button>
  </div>
</div>
